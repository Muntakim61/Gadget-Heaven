[build]
  command = "npm run build"
  publish = "dist"
  # ALLOWED_ORIGINS holds this site's own public URL (used for CORS
  # allowlisting in netlify/functions/chat.js), not a secret - but its
  # value is a plain string that can innocuously show up in build output,
  # which trips Netlify's secrets scanner. Excluding just this one key
  # rather than disabling scanning entirely.
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_ORIGINS"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendlier path for the chat function. Must come before the SPA
# catch-all below, since redirects are matched in order.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# SPA fallback: every path is served index.html so client-side routes
# (/cart, /Card/7, ...) resolve on a hard refresh or a shared link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
