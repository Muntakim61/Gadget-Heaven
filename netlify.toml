[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # ALLOWED_ORIGINS holds this site's own public URL (used for CORS
  # allowlisting in netlify/functions/chat.js), not a secret - but its
  # value is a plain string that can innocuously show up in repo files
  # (README, .env.example) and build output, which trips Netlify's
  # secrets scanner. Excluding just this one key rather than disabling
  # scanning entirely. (Must live under [build.environment], not bare
  # under [build] - that silently did nothing on the previous deploy.)
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_ORIGINS"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."chat"]
  # TEMP (diagnostic): default sync function timeout is 10s, which three
  # consecutive production calls all hit exactly - need to learn the real
  # latency before deciding the real fix.
  timeout = 26

# (No /api/chat alias: that rewrite proved unreliable for POST requests
# in production - the frontend calls /.netlify/functions/chat directly.)

# SPA fallback: every path is served index.html so client-side routes
# (/cart, /Card/7, ...) resolve on a hard refresh or a shared link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
